<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e9">
  <title>数字照片墙</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="wall.css">
</head>
<body class="wall-page">
  <header class="wall-topbar">
    <a class="brand" href="wall.html" aria-label="数字照片墙首页"><span class="brand-mark">墙</span><span>数字照片墙</span></a>
    <a class="primary-btn make-btn" href="index.html">＋ 制作明信片</a>
  </header>
  <main class="wall-shell">
    <section class="wall-hero">
      <p class="eyebrow">MY TRAVEL MEMORIES</p>
      <h1>把走过的地方，<br>留在一面墙上。</h1>
      <div class="wall-summary"><span id="workCount">0 张作品</span><i></i><span>仅保存在当前设备</span></div>
    </section>
    <section class="gallery" id="gallery" aria-live="polite"></section>
    <section class="empty-wall" id="emptyWall" hidden>
      <div class="empty-postcard"><span>YOUR JOURNEY</span><i></i><b>BEGINS HERE</b></div>
      <h2>照片墙还是空的</h2>
      <p>制作第一张旅行明信片，让旅途从这里开始。</p>
      <a class="primary-btn" href="index.html">制作第一张明信片 <span>→</span></a>
    </section>
  </main>
  <div class="wall-modal" id="viewer" hidden role="dialog" aria-modal="true" aria-label="查看明信片">
    <button class="viewer-close" id="closeViewer" type="button" aria-label="关闭">×</button>
    <img id="viewerImage" alt="旅行明信片大图">
    <div class="viewer-caption"><div><strong id="viewerPlace"></strong><p id="viewerMessage"></p></div><button id="deleteWork" type="button">从照片墙移除</button></div>
  </div>
  <script src="wall.js"></script>
</body>
</html>
